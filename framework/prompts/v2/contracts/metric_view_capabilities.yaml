# Versioned platform and accelerator capability contract for Metric View generation.
schema_version: "1.0"

contract:
  name: metric_view_capabilities
  contract_version: "2026.09.1"
  status: APPROVED
  owner: aibi_design_first_accelerator
  verified_at: "2026-09-19"
  review_after_days: 30

allowed_values:
  platform_support:
    - SUPPORTED
    - NOT_SUPPORTED
  accelerator_validation:
    - VALIDATED
    - PENDING
    - NOT_PLANNED
  target_status:
    - SATISFIED
    - NOT_SATISFIED
  disabled_action:
    - VALIDATED_FALLBACK
    - FALLBACK_OR_DOCUMENT
    - DOCUMENT_NOT_IMPLEMENTED
    - OMIT_OPTIONAL_OPTIMIZATION

platform_authority:
  vendor: Databricks
  cloud: AWS
  documentation:
    feature_availability: "https://docs.databricks.com/aws/en/uc-semantics/metric-views/feature-availability"
    yaml_reference: "https://docs.databricks.com/aws/en/uc-semantics/metric-views/yaml-reference"
    modeling: "https://docs.databricks.com/aws/en/uc-semantics/metric-views/basic-modeling"
    joins: "https://docs.databricks.com/aws/en/uc-semantics/metric-views/joins"
    advanced_techniques: "https://docs.databricks.com/aws/en/uc-semantics/metric-views/advanced-techniques"
    materialization: "https://docs.databricks.com/aws/en/uc-semantics/metric-views/materialization"
  documentation_usage: RELEASE_REFRESH_ONLY
  runtime_live_documentation_override: FORBIDDEN

execution_target:
  type: SQL_WAREHOUSE
  channel: PLATFORM_MANAGED_CURRENT
  deployment_path: STATEMENT_EXECUTION_API
  yaml_specification: "1.1"

execution_target_resolution:
  SQL_WAREHOUSE:
    version_management: PLATFORM_MANAGED
    target_status: SATISFIED
    runtime_minimum_policy: CURRENT_WAREHOUSE_SATISFIES_DOCUMENTED_DBR_MINIMUMS
  DATABRICKS_RUNTIME:
    target_status: NOT_SATISFIED
    reason: NOT_THE_APPROVED_ACCELERATOR_EXECUTION_TARGET

resolution_policy:
  contract_required: true
  missing_contract: HALT_CAPABILITY_CONTRACT_MISSING
  invalid_or_unapproved_contract: HALT_CAPABILITY_CONTRACT_INVALID
  unknown_capability_or_value: HALT_CAPABILITY_NOT_RESOLVED
  incompatible_execution_target: HALT_CAPABILITY_TARGET_INCOMPATIBLE
  same_version_hash_change: HALT_CAPABILITY_CONTRACT_MUTATED
  review_due_at_runtime: WARN_AND_CONTINUE_PINNED
  review_due_at_release_gate: FAIL_CAPABILITY_REFRESH_REQUIRED
  native_enabled_when_all_are_true:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
  resolution_order:
    - RESOLVE_EXACT_CAPABILITY_KEY
    - VALIDATE_ALL_ENUMS_AND_REQUIRED_FIELDS
    - EVALUATE_EXECUTION_TARGET
    - USE_NATIVE_WHEN_ENABLED
    - APPLY_DECLARED_FALLBACK
    - CLASSIFY_FINAL_OUTCOME
  final_outcomes:
    safe_equivalent_fallback_succeeded:
      status: IMPLEMENTED_AND_VALIDATED
      constraint_scope: NONE
    platform_capability_blocker:
      status: NOT_IMPLEMENTED
      constraint_scope: PLATFORM
      only_when: NO_APPLICABLE_SEMANTICS_PRESERVING_FALLBACK
    accelerator_capability_blocker:
      status: NOT_IMPLEMENTED
      constraint_scope: ACCELERATOR
      only_when: NO_APPLICABLE_SEMANTICS_PRESERVING_FALLBACK
    unsafe_data_or_relationship:
      status: SKIPPED_UNSAFE_GRAIN
      constraint_scope: DATA
    fallback_deployment_failed:
      status: HALT
      error_code: CAPABILITY_FALLBACK_FAILED

capabilities:
  yaml_specification_1_1:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
    requirements:
      yaml_specification: "1.1"

  table_or_view_source:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED

  sql_query_source:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    disabled_action: VALIDATED_FALLBACK
    fallback:
      strategy: GOVERNED_INTERMEDIATE_VIEW
      required_checks:
        - SOURCE_GRAIN_PRESERVED
        - FILTER_SEMANTICS_PRESERVED
        - JOIN_CARDINALITY_VALIDATED
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  direct_many_to_one_joins:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
    requirements:
      relationship_validation: PASS
      duplicate_lookup_keys: 0
      source_row_preservation: PASS

  rely_at_most_one_match:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "18.1"
    requirements:
      duplicate_lookup_keys: 0
      left_join_row_preservation: PASS

  join_condition_on:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED

  join_condition_using:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    disabled_action: VALIDATED_FALLBACK
    fallback:
      strategy: JOIN_CONDITION_ON
      required_checks:
        - SAME_JOIN_KEYS
        - SAME_NULL_SEMANTICS
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  nested_snowflake_joins:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "17.3"
    disabled_action: VALIDATED_FALLBACK
    fallback:
      strategy: GOVERNED_INTERMEDIATE_VIEW_OR_FLATTENED_DIRECT_JOINS
      required_checks:
        - SOURCE_GRAIN_PRESERVED
        - EVERY_LOOKUP_KEY_UNIQUE
        - EVERY_ADDITIVE_MEASURE_STABLE
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  one_to_many_joins:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "18.1"
      yaml_specification: "1.1"
    disabled_action: FALLBACK_OR_DOCUMENT
    fallback:
      strategy: SEPARATE_METRIC_VIEWS_BY_GRAIN
      required_checks:
        - EACH_SOURCE_GRAIN_VALIDATED
        - KPI_ASSIGNMENT_IS_UNAMBIGUOUS
        - DOWNSTREAM_QUERY_DOES_NOT_REQUIRE_CROSS_VIEW_MEASURE_COMPOSITION
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  standard_aggregate_measures:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED

  derived_measure_composition:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
    requirements:
      query_function: MEASURE

  post_aggregation_group_filter:
    platform_support: NOT_SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    disabled_action: FALLBACK_OR_DOCUMENT
    fallback:
      strategy: GOVERNED_PREAGGREGATED_INTERMEDIATE_VIEW
      required_checks:
        - GROUPING_GRAIN_MATCHES_KPI
        - THRESHOLD_SEMANTICS_PRESERVED
        - DOWNSTREAM_REAGGREGATION_IS_SAFE
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  subquery_in_measure_expression:
    platform_support: NOT_SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    disabled_action: FALLBACK_OR_DOCUMENT
    fallback:
      strategy: GOVERNED_INTERMEDIATE_VIEW
      required_checks:
        - SUBQUERY_RESULT_MATERIALIZED_AS_PHYSICAL_COLUMN
        - SOURCE_GRAIN_PRESERVED
        - MEASURE_RECONCILIATION_PASS
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  window_measures_base:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    disabled_action: DOCUMENT_NOT_IMPLEMENTED
    fallback: null
    on_unavailable:
      status: NOT_IMPLEMENTED
      constraint_scope: ACCELERATOR
      validated_reference_sql_required: true

  window_measures_dated_offset:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "18.1"
      yaml_specification: "1.1"
    disabled_action: DOCUMENT_NOT_IMPLEMENTED
    fallback: null
    on_unavailable:
      status: NOT_IMPLEMENTED
      constraint_scope: ACCELERATOR
      validated_reference_sql_required: true

  window_measures_numeric_index:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "19"
      yaml_specification: "1.1"
    disabled_action: DOCUMENT_NOT_IMPLEMENTED
    fallback: null
    on_unavailable:
      status: NOT_IMPLEMENTED
      constraint_scope: ACCELERATOR
      validated_reference_sql_required: true

  metric_view_filter:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    disabled_action: VALIDATED_FALLBACK
    fallback:
      strategy: GOVERNED_FILTERED_INTERMEDIATE_VIEW
      required_checks:
        - FILTER_SEMANTICS_PRESERVED
        - SOURCE_GRAIN_PRESERVED
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  parameters:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "18.2"
    disabled_action: FALLBACK_OR_DOCUMENT
    fallback:
      strategy: STATIC_APPROVED_VALUE
      required_checks:
        - KPI_SPEC_DEFINES_EXACTLY_ONE_APPROVED_VALUE
        - STATIC_VALUE_PRESERVES_REQUESTED_SEMANTICS
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  wildcard_field_and_measure_import:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "18.2"
      yaml_specification: "1.1"
    disabled_action: VALIDATED_FALLBACK
    fallback:
      strategy: EXPLICIT_FIELDS_AND_MEASURES
      required_checks:
        - EXPLICIT_NAMES_UNIQUE
        - EXPLICIT_EXPRESSIONS_VALIDATE
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  semantic_comment:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "17.3"
      yaml_specification: "1.1"

  semantic_display_name:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "17.3"
      yaml_specification: "1.1"

  semantic_format:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "17.3"
      yaml_specification: "1.1"

  semantic_synonyms:
    platform_support: SUPPORTED
    accelerator_validation: VALIDATED
    enabled: true
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "17.3"
      yaml_specification: "1.1"

  metric_view_as_source:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    disabled_action: FALLBACK_OR_DOCUMENT
    fallback:
      strategy: RESOLVE_TO_VALIDATED_TABLE_OR_VIEW_SOURCE
      required_checks:
        - SOURCE_FIELDS_AND_MEASURES_PRESERVE_SEMANTICS
        - SOURCE_GRAIN_PRESERVED
      success_status: IMPLEMENTED_AND_VALIDATED
      capability_blocker_status: NOT_IMPLEMENTED
      data_or_grain_blocker_status: SKIPPED_UNSAFE_GRAIN

  metric_view_materialization:
    platform_support: SUPPORTED
    accelerator_validation: PENDING
    enabled: false
    target_status: SATISFIED
    platform_requirements:
      non_warehouse_minimum_dbr: "17.3"
    disabled_action: OMIT_OPTIONAL_OPTIMIZATION
    fallback:
      strategy: UNMATERIALIZED_METRIC_VIEW
      success_status: IMPLEMENTED_AND_VALIDATED
    security_constraints:
      - NO_ROW_LEVEL_SECURITY
      - NO_COLUMN_MASKING
      - NO_ABAC_POLICIES
      - NO_INVOKER_DEPENDENT_EXPRESSIONS

artifact_requirements:
  resolved_copy:
    source: framework/contracts/metric_view_capabilities.yaml
    destination: "{OUTPUT_FOLDER}/metric_views/resolved_metric_view_capabilities.yaml"
    copy_mode: EXACT_BYTES
  hash:
    algorithm: SHA-256
    basis: RAW_FILE_BYTES
    trusted_digest_source: RELEASE_PACKAGE_MANIFEST
    required_at_release_gate: true
    required_at_runtime: false
  immutable_per_contract_version: true
  record_in:
    - metric_view_plan.yaml
    - metric_view_validation.yaml
    - metric_view_manifest.json
  required_fields:
    - capability_contract_name
    - capability_contract_version
    - capability_contract_sha256
  manifest_binding:
    - capability_contract_sha256
    - metric_view_spec_sha256
    - deployed_readback_sha256
  stale_when_contract_hash_changes: true

refresh_workflow:
  runtime_behavior: USE_PINNED_APPROVED_CONTRACT_ONLY
  triggers:
    - ACCELERATOR_RELEASE
    - DOCUMENTATION_REVIEW_DUE
    - TARGET_EXECUTION_CHANGE
  required_steps:
    - REVIEW_OFFICIAL_DATABRICKS_DOCUMENTATION
    - UPDATE_PLATFORM_SUPPORT_AND_REQUIREMENTS
    - RUN_COMPILER_AND_VALIDATOR_REGRESSION_CASES
    - PROMOTE_ONLY_TESTED_CAPABILITIES_TO_VALIDATED
    - BUMP_CONTRACT_VERSION
    - RECORD_CONTRACT_SHA256_IN_RELEASE_PACKAGE_MANIFEST
