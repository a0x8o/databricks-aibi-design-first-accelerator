version: '1.0'
domain:
  name: member_claims
  display_name: Member Claims
  description: Healthcare member claims analytics covering claim submissions, approvals,
    denials, provider utilization, and cost trends. Enables KPI tracking for claims
    processing efficiency, member out-of-pocket spend, provider network utilization,
    and denial root-cause analysis.
paths:
  bundle_root: ../..
  databricks_yml: ../../databricks.yml
  framework_root: ../../framework
  framework_prompts: ../../framework/agent_skills
  master_prompt: ../../framework/agent_skills/{agent_skills_version}/00_master_prompt.md
workspace:
  short_name: null
  agent_skills_version: v2
  output_subpath: generated_outputs
catalog:
  source:
    catalog: aw_serverless_stable_catalog
    schema: aibi_member_claims
  target:
    catalog: aw_serverless_stable_catalog
    schema: aibi_member_claims
data_source:
  type: erd
  erd:
    image: inputs/erd.png
  live_schema:
    catalog: aw_serverless_stable_catalog
    schema: aibi_member_claims
  greenfield:
    enabled: true
    synthetic_data: true
    volume: low
inputs:
  kpi_spec: inputs/kpi_spec.md
  best_practices: ../../framework/inputs/best_practices.md
assets:
  metric_views:
    strategy: auto
    naming_prefix: member_claims
  dashboards:
  - id: kpis
    name: member_claims_kpis_dashboard
  - id: utilization
    name: member_claims_utilization_dashboard
  genie:
    space_name: member_claims_analytics_genie
    notebook_name: genie_space_configuration_member_claims
  sample_queries_file: sample_queries_member_claims.sql
templates:
  genie_notebook: ../../framework/templates/genie_space_notebook.py.template
  ddl_notebook: ../../framework/templates/ddl_notebook.py.template
  dbldatagen_notebook: ../../framework/templates/dbldatagen_notebook.py.template
pipeline:
  steps:
    create_data_layer:
      enabled: true
      execution_type: notebook
      vision_input: true
    create_metric_views:
      enabled: true
      execution_type: sql
    create_dashboards:
      enabled: true
      execution_type: api
    create_genie_space:
      enabled: true
      execution_type: notebook
    generate_documentation:
      enabled: true
      execution_type: file
  clean_start: false
llm:
  default_model: databricks-gpt-5-5
  vision_model: databricks-gpt-5-5
  temperature: 1
  max_tokens: 32000
  steps:
    parse_erd:
      model: databricks-gpt-5-5
      capability: vision
      instruction: Must use vision model to read ERD image directly. Never read from
        previous version outputs.
    generate_sql:
      model: databricks-gpt-5-5
    dashboard_design:
      model: databricks-gpt-5-5
      instruction: 'Design rich multi-page dashboard layout using reasoning model.
        Input: KPI spec + metric view YAML + validation results + data profile. Output:
        YAML with pages, widgets, viz types, measure/dimension mappings. Validate:
        ≥2 canvas pages, 4-8 widgets/page, ≥3 viz types, exact measure names.

        '
    create_dashboards:
      model: databricks-gpt-5-5
      instruction: Must read lakeview_dashboard_api.md fully before building serialized_dashboard
        JSON.
    genie_design:
      model: databricks-gpt-5-5
      instruction: 'Design complete Genie Space configuration using reasoning model.
        Input: metric view DDL + validation + KPI spec + semantic inventory + data
        profile. Output: YAML with instructions (≥500 chars, no newlines), sample
        questions (≥15, ≥5 patterns), example SQL (≥10, all MEASURE()), benchmarks
        (≥15, different phrasing). Validate: measure/dimension names exact match,
        no skipped KPIs, grounded filter values.

        '
    create_genie_space:
      model: databricks-gpt-5-5
validation:
  require_all_kpis: true
  min_benchmark_questions: 15
quality_gates:
  min_widgets_per_canvas_page: 2
  min_filters_per_dashboard: 3
  min_datasets_per_dashboard: 1
  min_canvas_pages_per_dashboard: 1
  min_genie_instruction_chars: 200
  min_genie_tables: 1
  min_genie_sample_questions: 5
  min_genie_example_sqls: 5
  min_genie_description_chars: 50
